version: 2.1
jobs:
  test:
    docker:
      - image: cimg/node:18.20.7
    working_directory: ~/repo
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-dependencies-npm-{{ checksum "package.json" }}
            - v1-dependencies-npm
      - run: npm install
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-npm-{{ checksum "package.json" }}
      - run: npm test

  release:
    docker:
      - image: cimg/node:22.21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-npm-{{ checksum "package.json" }}
            - v1-dependencies-npm
      - run: npm install
      # npm trusted publishing: semantic-release exchanges this OIDC token for a
      # short-lived publish token, so it has to be exported in the same step
      - run: |
          export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
          npx semantic-release@25.0.9

workflows:
  test_and_release:
    jobs:
      - test
      - release-approval:
          type: approval
          filters:
            branches:
              only:
                - master
      - release:
          context: [test-runner:npm-release, org-npm-credentials]
          requires:
            - release-approval
          filters:
            branches:
              only:
                - master
